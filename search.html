    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
        body{color:#333;line-height:1.7;background:#f5f7fa;}
        header{background:rgba(26,26,46,0.95);color:#fff;padding:1.2rem 2rem;}
        .nav-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;}
        .logo{font-size:1.5rem;font-weight:bold;}
        .logo span{color:#4fc3f7;}
        nav a{color:#ccc;text-decoration:none;margin:0 15px;font-size:0.95rem;}
        nav a:hover{color:#4fc3f7;}
        .nav-cta{background:#1976d2;padding:0.5rem 1.2rem;border-radius:5px;}
        
        .container{max-width:800px;margin:3rem auto;padding:0 2rem;}
        .search-box{display:flex;gap:0.5rem;margin-bottom:2rem;}
        .search-box input{flex:1;padding:1rem;border:2px solid #ddd;border-radius:8px;font-size:1rem;}
        .search-box input:focus{outline:none;border-color:#1976d2;}
        .search-box button{background:#1976d2;color:#fff;border:none;padding:1rem 2rem;border-radius:8px;font-size:1rem;cursor:pointer;}
        
        .results h2{color:#1a1a2e;margin-bottom:1rem;}
        .result-card{background:#fff;padding:1.5rem;border-radius:8px;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
        .result-card h3{margin-bottom:0.3rem;}
        .result-card h3 a{color:#1976d2;text-decoration:none;}
        .result-card p{color:#666;font-size:0.95rem;}
        .no-results{text-align:center;color:#888;padding:3rem;}
    </style>
</head>
<body>
    <header>
        <div class="nav-inner">
            <div class="logo">KUNDAO <span>Apparel</span></div>
            <nav>
                <a href="index.html">Home</a>
                <a href="product.html">Products</a>
                <a href="blog.html">Blog</a>
                <a href="case.html">Cases</a>
                <a href="landing.html" class="nav-cta">Get Quote</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <h1 style="margin-bottom:1.5rem;color:#1a1a2e;">Search Our Site</h1>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search products, articles, cases...">
            <button onclick="doSearch()">Search</button>
        </div>

        <div class="results" id="results"></div>
    </div>

    <script>
        // 网站所有页面的数据（手动添加）
        const pages = [
            {
                title: "Men Gym T-Shirt - Product Page",
                url: "product.html",
                description: "Custom men fitness t-shirt bulk wholesale. High stretch workout tees, breathable mesh fabric, custom logo printing. MOQ 50 pcs.",
                keywords: "gym t-shirt, fitness shirt, workout tee, custom gym wear, wholesale"
            },
            {
                title: "How to Choose a Gym Wear Manufacturer - Blog",
                url: "blog.html",
                description: "Complete guide on how to choose a reliable fitness clothing manufacturer for your brand. Fabric, MOQ, samples, production tips.",
                keywords: "gym wear manufacturer, fitness clothing supplier, how to choose, factory"
            },
            {
                title: "Client Case Studies - KUNDAO Apparel",
                url: "case.html",
                description: "See how KUNDAO Apparel helps fitness brands worldwide. US brand, European startup, Australian gym chain success stories.",
                keywords: "case study, client success, fitness brand, testimonials"
            },
            {
                title: "Get Free Quote - Landing Page",
                url: "landing.html",
                description: "Request a free custom fitness apparel quote. Low MOQ 50 pcs, 15-25 day production. Reply within 24 hours.",
                keywords: "quote, price, inquiry, get quote, custom order"
            },
            {
                title: "Homepage - KUNDAO Apparel",
                url: "index.html",
                description: "Custom fitness wear manufacturer and wholesale supplier. Gym t-shirts, compression wear, mesh breathable series.",
                keywords: "home, fitness apparel, gym clothing, wholesale, manufacturer"
            }
        ];

        function doSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const resultsDiv = document.getElementById('results');
            
            if (!query) {
                resultsDiv.innerHTML = '<div class="no-results">Please enter a search term.</div>';
                return;
            }

            const matched = pages.filter(page => 
                page.title.toLowerCase().includes(query) ||
                page.description.toLowerCase().includes(query) ||
                page.keywords.toLowerCase().includes(query)
            );

            if (matched.length === 0) {
                resultsDiv.innerHTML = '<div class="no-results">No results found. Try "t-shirt", "manufacturer", "quote" or "case".</div>';
                return;
            }

            resultsDiv.innerHTML = `<h2>Search Results (${matched.length})</h2>` + matched.map(page => `
                <div class="result-card">
                    <h3><a href="${page.url}">${page.title}</a></h3>
                    <p>${page.description}</p>
                </div>
            `).join('');

            // 记录搜索事件
            gtag('event', 'search', { search_term: query });
        }

        // 按回车也能搜索
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doSearch();
        });
    </script>
</body>
</html>
